<!--
  NOT USED: the app now sends this email itself through SMTP (src/lib/emails.js).
  Kept for reference only.
  Supabase Dashboard → Authentication → Email Templates → "Magic Link"
  Subject: Your Everyday Mental Wellness sign-in link
  Paste the HTML below as the message body. Used for returning learners and for
  "my activation link expired".
-->
<div style="font-family:Arial,Helvetica,sans-serif;max-width:520px;margin:0 auto;color:#1f2d27">
  <p style="font-size:13px;color:#5f746b">Everyday Mental Wellness</p>
  <h2 style="margin:8px 0 12px">Continue to your learner account</h2>
  <p>Use the secure button below to sign in and continue where you left off.</p>
  <p style="margin:28px 0">
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=magiclink&next=/activate"
       style="background:#2a9d8f;color:#ffffff;padding:12px 22px;border-radius:8px;text-decoration:none;font-weight:bold">
      Continue
    </a>
  </p>
  <p style="font-size:13px;color:#5f746b">
    This link is single-use and expires after a limited period. If you did not request it, you can ignore this email.
  </p>
</div>
